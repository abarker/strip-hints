# Run the pytest suite on each supported Python version.  Python 3.6 is not
# available on any current GitHub runner, so it is not tested.
name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, since Ubuntu 26.04 has no Python 3.8 or 3.9 builds.
        os: [ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Python 3.7 is only available on Ubuntu 22.04.
          - {os: ubuntu-22.04, python-version: "3.7"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # The plugin reports test failures as annotations on the run and on PRs.
      - run: python -m pip install pytest pytest-github-actions-annotate-failures
      - run: python -m pytest
