[build-system]

requires = ["setuptools >= 77.0"]

build-backend = "setuptools.build_meta"

[project]

name = "strip-hints"

version = "0.2.0"

description = "Function and command-line program to strip Python type hints."

readme = "README.rst"

requires-python = ">=3.6"

license = "MIT"

license-files = ["LICENSE.txt"]

authors = [
    { name = "Allen Barker", email = "Allen.L.Barker@gmail.com" },
]

keywords = [
    "annotations",
    "hints",
    "strip",
    "type",
    "typing",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities",
]

[project.scripts]
strip-hints = "strip_hints.strip_hints_main:process_command_line"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/abarker/strip-hints"

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = ["cases"]
pythonpath = ["src"]

